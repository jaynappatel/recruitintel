<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>RecruitIntel</title>
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body>
    <main>
      <h1>RecruitIntel</h1>
      <p id="privacy">
        Scans happen only when you press Scan. No forms, cookies, or browser storage are read.
      </p>
      <label
        >RecruitIntel server <input id="server" type="url" placeholder="https://app.example.com"
      /></label>
      <label>Scoped extension grant <input id="token" type="password" autocomplete="off" /></label>
      <button id="connect">Connect</button><button id="scan" disabled>Scan current page</button>
      <p id="status" role="status"></p>
      <section id="candidates" aria-live="polite"></section>
    </main>
    <script type="module" src="sidepanel.js"></script>
  </body>
</html>
