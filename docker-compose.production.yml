# Deployment template. Secrets are injected by the platform secret manager; no
# passwords, tokens, or production database are declared here.
services:
  web:
    build: .
    read_only: true
    tmpfs: [/tmp]
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL:?secret-manager-injected}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?secret-manager-injected}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?required}
      BETTER_AUTH_TRUSTED_ORIGINS: ${BETTER_AUTH_TRUSTED_ORIGINS:?required}
      ZERO_COST_MODE: "true"
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/ready"]
      interval: 15s
      timeout: 3s
      retries: 3
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile.collectors
    command: ["python", "-m", "recruitintel_collectors", "scheduler"]
    restart: unless-stopped
    environment:
      DATABASE_URL: ${COLLECTOR_DATABASE_URL:?secret-manager-injected}
      RECRUITINTEL_USER_AGENT: ${RECRUITINTEL_USER_AGENT:?required}
      ZERO_COST_MODE: "true"
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]

  worker:
    build:
      context: .
      dockerfile: Dockerfile.collectors
    command: ["python", "-m", "recruitintel_collectors", "worker", "--classes", "ATS,GITHUB,WEB_SEARCH,WEB_FETCH,PROJECTION,CONTROL,RESUME"]
    restart: unless-stopped
    environment:
      DATABASE_URL: ${COLLECTOR_DATABASE_URL:?secret-manager-injected}
      RECRUITINTEL_USER_AGENT: ${RECRUITINTEL_USER_AGENT:?required}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      ZERO_COST_MODE: "true"
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
