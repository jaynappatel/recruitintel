[project]
name = "recruitintel-collectors"
version = "0.1.0"
description = "Deterministic, provenance-first collectors for RecruitIntel"
requires-python = ">=3.12"
dependencies = [
  "cryptography==50.0.0",
  "httpx==0.28.1",
  "psycopg[binary]==3.3.4",
  "pydantic==2.13.4",
]

[dependency-groups]
dev = [
  "mypy>=1.19,<2",
  "pytest>=8.4,<10",
  "pytest-asyncio>=1.2,<2",
  "ruff>=0.14,<1",
]

[project.scripts]
recruitintel-collectors = "recruitintel_collectors.cli:main"

[build-system]
requires = ["hatchling>=1.28"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/recruitintel_collectors"]
