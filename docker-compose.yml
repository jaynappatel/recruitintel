services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: recruitintel
      POSTGRES_USER: recruitintel
      POSTGRES_PASSWORD: recruitintel
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recruitintel -d recruitintel"]
      interval: 3s
      timeout: 3s
      retries: 15
    volumes:
      - recruitintel-postgres:/var/lib/postgresql/data

volumes:
  recruitintel-postgres:

