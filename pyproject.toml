[tool.uv.workspace]
members = ["services/collectors"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "ASYNC", "S", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"services/collectors/tests/**/*.py" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
packages = ["recruitintel_collectors"]
mypy_path = "services/collectors/src"

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
asyncio_mode = "auto"
testpaths = ["services/collectors/tests"]
markers = [
  "integration: requires TEST_DATABASE_URL and a migrated PostgreSQL database",
  "network: opt-in live provider contract smoke test",
]

